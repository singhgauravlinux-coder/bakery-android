apiVersion: apps/v1
kind: Deployment
metadata:
  name: consent-service
  namespace: bakery
  labels:
    app: consent-service
    app.kubernetes.io/part-of: crumb-and-ember
spec:
  replicas: 1
  selector:
    matchLabels:
      app: consent-service
  template:
    metadata:
      labels:
        app: consent-service
    spec:
      securityContext:
        runAsNonRoot: true
        runAsUser: 1000
        runAsGroup: 1000
        seccompProfile:
          type: RuntimeDefault
      initContainers:
        # Same pattern as auth-service/order-service/etc: applies every file
        # in db/migrations (mounted via the bakery-db-migrations ConfigMap)
        # idempotently before the main container starts, so pod readiness
        # blocks until the user_consents table actually exists instead of
        # racing it.
        - name: db-migrate
          image: postgres:16-alpine
          envFrom:
            - secretRef:
                name: bakery-db-secret
          env:
            - name: HOME
              value: /tmp
          securityContext:
            allowPrivilegeEscalation: false
            readOnlyRootFilesystem: true
            capabilities:
              drop: ["ALL"]
          volumeMounts:
            - name: db-migrations
              mountPath: /migrations
              readOnly: true
            - name: tmp
              mountPath: /tmp
          command:
            - sh
            - -c
            - |
              set -eu
              echo "waiting for postgres..."
              until pg_isready -h postgres -p 5432 -U "$POSTGRES_USER" -d "$POSTGRES_DB" >/dev/null 2>&1; do
                sleep 2
              done
              echo "applying db/migrations..."
              for f in $(ls /migrations/*.sql | sort); do
                echo "  -> $(basename "$f")"
                psql "$DATABASE_URL" -v ON_ERROR_STOP=1 -f "$f"
              done
              echo "migrations applied."
      containers:
        - name: consent-service
          image: ghcr.io/singhgauravlinux-coder/bakery-android/consent-service:latest
          imagePullPolicy: Always
          ports:
            - containerPort: 3024
          securityContext:
            allowPrivilegeEscalation: false
            readOnlyRootFilesystem: true
            capabilities:
              drop: ["ALL"]
          env:
            - name: SERVICE_NAME
              value: "consent-service"
            - name: PORT
              value: "3024"
            - name: LOG_LEVEL
              value: "info"
            - name: DATABASE_URL
              valueFrom:
                secretKeyRef:
                  name: bakery-db-secret
                  key: DATABASE_URL
          readinessProbe:
            httpGet:
              path: /ready
              port: 3024
            initialDelaySeconds: 5
            periodSeconds: 10
          livenessProbe:
            httpGet:
              path: /health
              port: 3024
            initialDelaySeconds: 10
            periodSeconds: 20
          resources:
            requests:
              cpu: 50m
              memory: 64Mi
            limits:
              cpu: 250m
              memory: 128Mi
      volumes:
        - name: db-migrations
          configMap:
            name: bakery-db-migrations
        - name: tmp
          emptyDir: {}
---
apiVersion: v1
kind: Service
metadata:
  name: consent-service
  namespace: bakery
  labels:
    app: consent-service
spec:
  selector:
    app: consent-service
  ports:
    - port: 3024
      targetPort: 3024
      protocol: TCP
