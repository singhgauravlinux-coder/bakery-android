# Register with: kubectl apply -f argocd/production-app.yaml --namespace argocd
#
# Mobile parity: the Android app's "production" flavor is hardcoded to
# bakery.local, the exact host this Application's Ingress serves (see
# k8s/overlays/production/patch-ingress-host.yaml). Its build
# (.github/workflows/_mobile-pipeline.yml, promote-production job) sits
# behind the same "production" GitHub Environment reviewers as the image
# bump that lands here — and, like this Application, has no automated final
# step: a human still has to publish the signed .aab (Play Console / manual
# upload) the same way a human still has to run `argocd app sync
# bakery-production`. Neither side ships to real users by itself.
apiVersion: argoproj.io/v1alpha1
kind: Application
metadata:
  name: bakery-production
  namespace: argocd
  labels:
    app.kubernetes.io/part-of: crumb-and-ember
spec:
  project: default
  source:
    repoURL: https://github.com/singhgauravlinux-coder/bakery-android.git
    targetRevision: main
    path: k8s/overlays/production
  destination:
    server: https://kubernetes.default.svc
    namespace: bakery-prod
  syncPolicy:
    # Deliberately no `automated:` block. GitHub's "production" Environment
    # already required a reviewer before the image-tag commit landed; Argo
    # then requires a second, independent action - `argocd app sync
    # bakery-production` or clicking Sync in the UI - before anything
    # actually changes in the prod cluster.
    syncOptions:
      - CreateNamespace=true
