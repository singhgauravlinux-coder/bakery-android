# Register with: kubectl apply -f argocd/dev-app.yaml --namespace argocd
# (once, against whatever cluster runs your Argo CD control plane)
#
# Mobile parity: the Android app's "dev" flavor targets 10.0.2.2 (emulator
# loopback to a local docker-compose stack) by default; point it at
# dev.bakery.local instead (android-app/app/build.gradle.kts) once this
# Application's Ingress is reachable from wherever you run the emulator/
# device. Its CI (.github/workflows/_mobile-pipeline.yml) builds and tests
# on every push with no gate, same as this Application's automated sync.
apiVersion: argoproj.io/v1alpha1
kind: Application
metadata:
  name: bakery-dev
  namespace: argocd
  labels:
    app.kubernetes.io/part-of: crumb-and-ember
spec:
  project: default
  source:
    # Replace with this repo's actual URL.
    repoURL: https://github.com/singhgauravlinux-coder/bakery-android.git
    targetRevision: main
    path: k8s/overlays/dev
  destination:
    server: https://kubernetes.default.svc
    namespace: bakery-dev
  syncPolicy:
    # Dev auto-syncs the moment a service's CI pipeline commits a new image
    # tag - no human in the loop, fastest feedback.
    automated:
      prune: true      # remove resources deleted from git
      selfHeal: true    # revert manual kubectl edits back to what git says
    syncOptions:
      - CreateNamespace=true
